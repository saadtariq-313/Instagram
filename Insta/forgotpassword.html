<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find your account</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #1c1e21;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-top: 40px;
    }

    .container {
      width: 440px;
      max-width: 90%;
    }

    .back-arrow {
      font-size: 20px;
      color: #1c1e21;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #1c1e21;
      margin-bottom: 20px;
    }

    .subtitle a {
      color: #0064e0;
      text-decoration: none;
      font-weight: 500;
    }

    .input-box {
      width: 100%;
      height: 52px;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 14px;
      background: #ffffff;
      margin-bottom: 12px;
    }

    .input-box:focus {
      outline: none;
      border-color: #0064e0;
    }

    .notice {
      font-size: 12px;
      color: #65676b;
      margin-bottom: 24px;
    }

    .continue-btn {
      width: 100%;
      height: 44px;
      background-color: #0064e0;
      color: white;
      border: none;
      border-radius: 22px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    footer {
      margin-top: auto;
      padding: 30px 0;
      font-size: 12px;
      color: #737373;
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }

    .footer-links a {
      color: #737373;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="Login.html" class="back-arrow">&#10094;</a>

    <h1>Find your account</h1>
    <p class="subtitle">Enter your mobile number, username or email. <a href="#">Can't reset your password?</a></p>

    <form action="#">
      <input type="text" class="input-box" placeholder="Mobile number, username or email" required>
      <p class="notice">You may receive WhatsApp and SMS notifications from us for security and login purposes.</p>
      <button type="submit" class="continue-btn">Continue</button>
    </form>
  </div>

 

</body>
</html>
