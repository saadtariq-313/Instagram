<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-container {
      display: flex;
      flex: 1;
      width: 100%;
      min-height: 88vh;
    }

    .left-section {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    .insta-logo-top {
      position: absolute;
      top: 30px;
      left: 40px;
      width: 38px;
    }

    .hero-heading {
      font-size: 3.2rem;
      font-weight: 500;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
    }

    .gradient-text {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 500;
    }

    .hero-art {
      width: 440px;
      max-width: 90%;
      position: relative;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      position: absolute;
      width: 220px;
      overflow: hidden;
    }

    .card-1 {
      top: 0;
      left: 10px;
      transform: rotate(-6deg);
      z-index: 1;
    }

    .card-2 {
      top: 20px;
      left: 100px;
      transform: rotate(2deg);
      z-index: 3;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .card-3 {
      top: 40px;
      left: 200px;
      transform: rotate(8deg);
      z-index: 2;
    }

    .card-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    .right-section {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 80px;
      border-left: 1px solid #e1e1e1;
    }

    .login-box {
      max-width: 360px;
      width: 100%;
      margin: 0 auto;
    }

    .login-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .input-field {
      width: 100%;
      height: 50px;
      border: 1px solid #dbdbdb;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 14px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .input-field:focus {
      outline: none;
      border-color: #a8a8a8;
      background: #ffffff;
    }

    .login-btn {
      width: 100%;
      height: 44px;
      background-color: #0095f6;
      color: white;
      border: none;
      border-radius: 22px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }

    .forgot-link {
      display: block;
      text-align: center;
      color: #000000;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      margin: 20px 0 35px;
    }

    .fb-btn {
      width: 100%;
      height: 44px;
      background: #f4f4f4;
      border: none;
      border-radius: 22px;
      color: #000;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .fb-icon {
      width: 18px;
      height: 18px;
      background: #1877f2;
      color: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
    }

    .create-btn {
      width: 100%;
      height: 44px;
      background: transparent;
      border: 1px solid #0095f6;
      color: #0095f6;
      border-radius: 22px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      margin-bottom: 30px;
    }

    .meta-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #0064e0;
      font-weight: 700;
      font-size: 14px;
    }

    footer {
      padding: 20px 0;
      font-size: 12px;
      color: #737373;
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }

    .footer-links a {
      color: #737373;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="main-container">
    <div class="left-section">
      <svg class="insta-logo-top" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
      <h1 class="hero-heading">See everyday<br>moments from your<br><span class="gradient-text">close friends.</span>
      </h1>
      <div class="hero-art" style="height: 350px;">
        <div class="card card-1"><img
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80"
            class="card-img" alt="art"></div>
        <div class="card card-2"><img
            src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80"
            class="card-img" alt="art"></div>
        <div class="card card-3"><img
            src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=400&q=80"
            class="card-img" alt="art"></div>
      </div>
    </div>

    <div class="right-section">
      <div class="login-box">
        <div class="login-title">Log into Instagram</div>
        <form action="#">
          <input type="text" class="input-field" placeholder="Mobile number, username or email" required>
          <input type="password" class="input-field" placeholder="Password" required>
          <button type="submit" class="login-btn">Log in</button>
        </form>

        <a href="./forgotpassword.html" class="forgot-link">Forgot password?</a>

        <button class="fb-btn">
          <span class="fb-icon">f</span> Log in with Facebook
        </button>

        <a href="./signup.html" class="create-btn">Create new account</a>

        <div class="meta-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#0064e0">
            <path
              d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z" />
          </svg>
          Meta
        </div>
      </div>
    </div>
  </div>


</body>

</html>
